name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: unit tests + coverage
        run: npm run test:coverage
      - name: build (npm package)
        run: npm run build
      - name: smoke test (built CLI)
        run: |
          node dist/adapters/bin.js 40000 --ateco 62.01 --scadenze
          node dist/adapters/bin.js settori
      - name: npm pack (contenuto del pacchetto)
        run: npm pack --dry-run
      - name: core size guard (< 1500 LOC)
        run: |
          LINES=$(find src/core -name '*.ts' -print0 | xargs -0 cat | grep -cv '^\s*$')
          echo "core: $LINES non-empty lines"
          [ "$LINES" -le 1500 ] || { echo "::error::core over 1500 lines ($LINES)"; exit 1; }
      - name: SPDX headers
        run: |
          MISSING=$(grep -L 'SPDX-License-Identifier' $(git ls-files 'src/*.ts' 'test/*.ts' 'e2e/*.ts' 'examples/*.ts' 'scripts/*.mjs') || true)
          [ -z "$MISSING" ] || { echo "::error::missing SPDX header: $MISSING"; exit 1; }

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: web app e2e (desktop + mobile, axe)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
